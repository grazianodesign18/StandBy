<!-- MAIN APP SCRIPT -->
    <script>
        const state = {
            is12h: true,
            tempUnit: 'C',
            tempC: 22,
            burnIn: true,
            spotifyClientId: 'dac8f42143164aa28813f12d9a23e2f7',
            accessToken: null,
            isPlaying: false,
            trackDuration: 0,
            trackProgress: 0,
            lastFetchTime: 0,
            isScrubbing: false,
            pollInterval: null,
            localTickInterval: null,
            hideToolbarTimeout: null,
            currentImageSrc: '',
            deferredPrompt: null,
            wakeLock: null,
            currentAlbumId: null,
            activeTab: 'album',
            currentTrackUri: null
        };

        const floatingToolbar = document.getElementById('floating-toolbar');
        const settingsModal = document.getElementById('settings-modal');
        const spotifyDrawer = document.getElementById('spotify-drawer');
        const closeDrawerBtn = document.getElementById('close-drawer-btn');
        const spotifyBanner = document.getElementById('spotify-banner');
        const drawerTrackList = document.getElementById('drawer-track-list');
        const drawerHeaderTitle = document.getElementById('drawer-header-title');

        const tabAlbum = document.getElementById('tab-album');
        const tabRecent = document.getElementById('tab-recent');
        const tabSaved = document.getElementById('tab-saved');

        const ambientGlow = document.getElementById('ambient-glow');
        const albumArt = document.getElementById('album-art');
        const clockHours = document.getElementById('clock-hours');
        const clockMinutes = document.getElementById('clock-minutes');
        const clockAmpm = document.getElementById('clock-ampm');
        const clockDate = document.getElementById('clock-date');
        const burninWrapper = document.getElementById('burnin-wrapper');

        const connectSpotifyBtn = document.getElementById('connect-spotify-btn');
        const spotifyLoginView = document.getElementById('spotify-login-view');
        const spotifyPlayerView = document.getElementById('spotify-player-view');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const trackScrubber = document.getElementById('track-scrubber');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const installPwaBtn = document.getElementById('install-pwa-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const cfg12h = document.getElementById('cfg-12h');
        const cfgBurnin = document.getElementById('cfg-burnin');
        const unitC = document.getElementById('unit-c');
        const unitF = document.getElementById('unit-f');
        const spotifyAccountStatus = document.getElementById('spotify-account-status');
        const logoutSpotifyBtn = document.getElementById('logout-spotify-btn');

        // Clean base redirect URI matching your GitHub Pages root
        const REDIRECT_URI = window.location.origin + window.location.pathname.split('?')[0].split('#')[0];

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    state.wakeLock = await navigator.wakeLock.request('screen');
                    state.wakeLock.addEventListener('release', () => {
                        state.wakeLock = null;
                    });
                } catch (err) {}
            }
        }

        async function triggerFullscreenAndWakeLock() {
            if (!document.fullscreenElement) {
                try {
                    await document.documentElement.requestFullscreen();
                } catch (e) {}
            }
            await requestWakeLock();
        }

        window.addEventListener('load', () => {
            triggerFullscreenAndWakeLock();
        });

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            
            if (state.is12h) {
                const ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
                clockAmpm.textContent = ampm;
                clockAmpm.style.display = 'inline';
            } else {
                clockAmpm.style.display = 'none';
                h = String(h).padStart(2, '0');
            }

            clockHours.textContent = h;
            clockMinutes.textContent = m;

            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            clockDate.textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function applyBurnInShift() {
            if (!state.burnIn) return;
            const x = (Math.random() - 0.5) * 16;
            const y = (Math.random() - 0.5) * 16;
            burninWrapper.style.transform = `translate(${x}px, ${y}px)`;
        }
        setInterval(applyBurnInShift, 60000);

        function showToolbar() {
            triggerFullscreenAndWakeLock();
            floatingToolbar.classList.remove('opacity-0', 'pointer-events-none');
            floatingToolbar.classList.add('opacity-100', 'pointer-events-auto');

            clearTimeout(state.hideToolbarTimeout);
            state.hideToolbarTimeout = setTimeout(() => {
                if (settingsModal.classList.contains('hidden') && spotifyDrawer.classList.contains('hidden')) {
                    floatingToolbar.classList.remove('opacity-100', 'pointer-events-auto');
                    floatingToolbar.classList.add('opacity-0', 'pointer-events-none');
                }
            }, 2000);
        }

        window.addEventListener('touchstart', showToolbar, { passive: true });
        window.addEventListener('mousemove', showToolbar, { passive: true });
        window.addEventListener('click', showToolbar, { passive: true });

        function updateAmbientColor(imgSrc) {
            if (state.currentImageSrc === imgSrc) return;
            state.currentImageSrc = imgSrc;

            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgSrc;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1;
                canvas.height = 1;
                ctx.drawImage(img, 0, 0, 1, 1);
                const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
                ambientGlow.style.background = `radial-gradient(circle, rgba(${r},${g},${b},0.85) 0%, rgba(0,0,0,0) 75%)`;
            };
        }

        async function initBattery() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    const updateBattery = () => {
                        const lvl = Math.round(battery.level * 100);
                        document.getElementById('battery-level').textContent = `${lvl}%`;
                        const batIcon = document.getElementById('battery-icon');
                        if (battery.charging) {
                            batIcon.className = 'fa-solid fa-bolt text-zinc-200 text-xs';
                        } else {
                            batIcon.className = 'fa-solid fa-battery-three-quarters text-zinc-400 text-xs';
                        }
                    };
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                    battery.addEventListener('chargingchange', updateBattery);
                } catch(e) {}
            }
        }
        initBattery();

        const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing streaming user-read-email user-read-private user-library-read user-read-recently-played';

        function generateRandomString(length) {
            let text = '';
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            
            let digest;
            if (window.crypto && window.crypto.subtle) {
                digest = await window.crypto.subtle.digest('SHA-256', data);
                return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } else {
                const hashBytes = sha256.array(codeVerifier);
                return btoa(String.fromCharCode.apply(null, hashBytes))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }
        }

        async function redirectToSpotifyAuth() {
            const verifier = generateRandomString(128);
            localStorage.setItem('spotify_code_verifier', verifier);
            const challenge = await generateCodeChallenge(verifier);

            const args = new URLSearchParams({
                response_type: 'code',
                client_id: state.spotifyClientId,
                scope: SCOPES,
                redirect_uri: REDIRECT_URI,
                code_challenge_method: 'S256',
                code_challenge: challenge
            });

            window.location.href = `https://accounts.spotify.com/authorize?${args.toString()}`;
        }

        async function handleSpotifyCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (!code) return;

            const verifier = localStorage.getItem('spotify_code_verifier');

            const body = new URLSearchParams({
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: REDIRECT_URI,
                client_id: state.spotifyClientId,
                code_verifier: verifier
            });

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body
                });
                const data = await response.json();
                if (data.access_token) {
                    state.accessToken = data.access_token;
                    localStorage.setItem('spotify_access_token', data.access_token);
                    window.history.replaceState({}, document.title, window.location.pathname);
                    initSpotifyPlayer();
                } else {
                    console.error("Token Exchange Failed:", data);
                    alert("Spotify authorization failed. Re-connecting account...");
                    localStorage.removeItem('spotify_access_token');
                }
            } catch (e) {
                console.error("Spotify Auth Error:", e);
            }
        }

        async function fetchCurrentPlayback() {
            if (!state.accessToken) return;
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player', {
                    headers: { 'Authorization': `Bearer ${state.accessToken}` }
                });
                if (res.status === 401) {
                    // Token expired/invalid scope -> clear and prompt reconnect
                    localStorage.removeItem('spotify_access_token');
                    state.accessToken = null;
                    spotifyLoginView.classList.remove('hidden');
                    spotifyPlayerView.classList.add('hidden');
                    return;
                }
                if (res.status === 204 || res.status > 400) return;
                const data = await res.json();
                if (data && data.item) {
                    trackTitle.textContent = data.item.name;
                    trackArtist.textContent = data.item.artists.map(a => a.name).join(', ');
                    const newArt = data.item.album.images[0]?.url || albumArt.src;
                    albumArt.src = newArt;
                    updateAmbientColor(newArt);

                    state.isPlaying = data.is_playing;
                    state.currentAlbumId = data.item.album.id;
                    state.currentTrackUri = data.item.uri;
                    playIcon.className = state.isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play ml-0.5';
                    state.trackDuration = Math.floor(data.item.duration_ms / 1000);
                    
                    if (!state.isScrubbing) {
                        state.trackProgress = Math.floor(data.progress_ms / 1000);
                        state.lastFetchTime = Date.now();
                        updateScrubberUI();
                    }
                }
            } catch (e) {}
        }

        function localProgressTick() {
            if (state.isPlaying && !state.isScrubbing && state.trackDuration > 0) {
                state.trackProgress++;
                if (state.trackProgress > state.trackDuration) {
                    state.trackProgress = state.trackDuration;
                }
                updateScrubberUI();
            }
        }

        function updateScrubberUI() {
            if (!state.trackDuration) return;
            trackScrubber.value = (state.trackProgress / state.trackDuration) * 100;
            timeCurrent.textContent = formatTime(state.trackProgress);
            timeTotal.textContent = formatTime(state.trackDuration);
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        async function playTrackByUri(uri, contextUri = null) {
            if (!state.accessToken) return;
            try {
                const body = contextUri ? { context_uri: contextUri, offset: { uri: uri } } : { uris: [uri] };
                await fetch('https://api.spotify.com/v1/me/player/play', {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${state.accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                spotifyDrawer.classList.add('hidden');
                setTimeout(fetchCurrentPlayback, 400);
            } catch (e) {
                console.error("Play Track Error:", e);
            }
        }

        async function loadDrawerTabContent(tab) {
            state.activeTab = tab;
            drawerTrackList.innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">Loading tracks...</p>';
            
            [tabAlbum, tabRecent, tabSaved].forEach(btn => {
                btn.className = "px-3 py-1.5 rounded-full bg-zinc-900 text-zinc-400 hover:text-white transition";
            });

            if (tab === 'album') {
                tabAlbum.className = "px-3 py-1.5 rounded-full bg-white text-black transition font-bold";
                drawerHeaderTitle.textContent = "Current Album";
                if (!state.currentAlbumId) {
                    drawerTrackList.innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">No album playing</p>';
                    return;
                }
                try {
                    const res = await fetch(`https://api.spotify.com/v1/albums/${state.currentAlbumId}`, {
                        headers: { 'Authorization': `Bearer ${state.accessToken}` }
                    });
                    const albumData = await res.json();
                    renderTrackList(albumData.tracks.items, albumData.uri);
                } catch(e) {
                    drawerTrackList.innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">Failed to load album tracks</p>';
                }
            } else if (tab === 'recent') {
                tabRecent.className = "px-3 py-1.5 rounded-full bg-white text-black transition font-bold";
                drawerHeaderTitle.textContent = "Recently Played";
                try {
                    const res = await fetch('https://api.spotify.com/v1/me/player/recently-played?limit=20', {
                        headers: { 'Authorization': `Bearer ${state.accessToken}` }
                    });
                    const data = await res.json();
                    const tracks = data.items.map(item => item.track);
                    renderTrackList(tracks);
                } catch(e) {
                    drawerTrackList.innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">Failed to load recent tracks</p>';
                }
            } else if (tab === 'saved') {
                tabSaved.className = "px-3 py-1.5 rounded-full bg-white text-black transition font-bold";
                drawerHeaderTitle.textContent = "Liked Songs";
                try {
                    const res = await fetch('https://api.spotify.com/v1/me/tracks?limit=30', {
                        headers: { 'Authorization': `Bearer ${state.accessToken}` }
                    });
                    const data = await res.json();
                    const tracks = data.items.map(item => item.track);
                    renderTrackList(tracks);
                } catch(e) {
                    drawerTrackList.innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">Failed to load liked songs</p>';
                }
            }
        }

        function renderTrackList(tracks, contextUri = null) {
            if (!tracks || tracks.length === 0) {
                drawerTrackList.innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">No tracks found</p>';
                return;
            }

            drawerTrackList.innerHTML = '';
            tracks.forEach((track, index) => {
                const isPlayingThis = state.currentTrackUri === track.uri;
                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition ${isPlayingThis ? 'bg-white/10 text-white font-bold' : 'hover:bg-zinc-900 text-zinc-300'}`;
                
                const artistName = track.artists ? track.artists.map(a => a.name).join(', ') : 'Unknown Artist';
                
                row.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0 pr-2">
                        <span class="text-[10px] text-zinc-500 w-4 text-center flex-shrink-0 font-bold">${index + 1}</span>
                        <div class="flex flex-col min-w-0">
                            <span class="text-xs truncate ${isPlayingThis ? 'text-green-400 font-extrabold' : 'text-white'}">${track.name}</span>
                            <span class="text-[10px] text-zinc-500 truncate">${artistName}</span>
                        </div>
                    </div>
                    <i class="fa-solid ${isPlayingThis ? 'fa-volume-high text-green-400' : 'fa-play text-zinc-600 group-hover:text-white'} text-xs flex-shrink-0"></i>
                `;

                row.addEventListener('click', () => playTrackByUri(track.uri, contextUri));
                drawerTrackList.appendChild(row);
            });
        }

        async function seekSpotifyPlayback(positionMs) {
            if (!state.accessToken) return;
            try {
                await fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${positionMs}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${state.accessToken}` }
                });
                setTimeout(fetchCurrentPlayback, 300);
            } catch (e) {}
        }

        async function spotifyControl(action, method = 'POST') {
            if (!state.accessToken) return;
            try {
                await fetch(`https://api.spotify.com/v1/me/player/${action}`, {
                    method: method,
                    headers: { 'Authorization': `Bearer ${state.accessToken}` }
                });
                setTimeout(fetchCurrentPlayback, 300);
            } catch (e) {}
        }

        function initSpotifyPlayer() {
            const savedToken = localStorage.getItem('spotify_access_token');
            if (savedToken) state.accessToken = savedToken;

            if (state.accessToken) {
                spotifyLoginView.classList.add('hidden');
                spotifyPlayerView.classList.remove('hidden');
                spotifyAccountStatus.textContent = "Spotify: Connected";
                logoutSpotifyBtn.classList.remove('hidden');
                
                fetchCurrentPlayback();
                if (state.pollInterval) clearInterval(state.pollInterval);
                if (state.localTickInterval) clearInterval(state.localTickInterval);
                
                state.pollInterval = setInterval(fetchCurrentPlayback, 5000);
                state.localTickInterval = setInterval(localProgressTick, 1000);
            }
        }

        spotifyBanner.addEventListener('click', () => {
            spotifyDrawer.classList.remove('hidden');
            loadDrawerTabContent('album');
        });

        closeDrawerBtn.addEventListener('click', () => spotifyDrawer.classList.add('hidden'));

        tabAlbum.addEventListener('click', () => loadDrawerTabContent('album'));
        tabRecent.addEventListener('click', () => loadDrawerTabContent('recent'));
        tabSaved.addEventListener('click', () => loadDrawerTabContent('saved'));

        trackScrubber.addEventListener('input', (e) => {
            state.isScrubbing = true;
            if (state.trackDuration > 0) {
                const targetSecs = Math.floor((e.target.value / 100) * state.trackDuration);
                timeCurrent.textContent = formatTime(targetSecs);
            }
        });

        trackScrubber.addEventListener('change', (e) => {
            if (state.trackDuration > 0) {
                const targetSecs = Math.floor((e.target.value / 100) * state.trackDuration);
                state.trackProgress = targetSecs;
                seekSpotifyPlayback(targetSecs * 1000);
            }
            state.isScrubbing = false;
        });

        connectSpotifyBtn.addEventListener('click', redirectToSpotifyAuth);
        
        playBtn.addEventListener('click', () => {
            if (state.isPlaying) {
                spotifyControl('pause', 'PUT');
            } else {
                spotifyControl('play', 'PUT');
            }
        });
        nextBtn.addEventListener('click', () => spotifyControl('next'));
        prevBtn.addEventListener('click', () => spotifyControl('previous'));

        logoutSpotifyBtn.addEventListener('click', () => {
            localStorage.removeItem('spotify_access_token');
            state.accessToken = null;
            spotifyLoginView.classList.remove('hidden');
            spotifyPlayerView.classList.add('hidden');
            logoutSpotifyBtn.classList.add('hidden');
            spotifyAccountStatus.textContent = "Spotify: Not Connected";
            if (state.pollInterval) clearInterval(state.pollInterval);
            if (state.localTickInterval) clearInterval(state.localTickInterval);
        });

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            state.deferredPrompt = e;
            installPwaBtn.classList.remove('hidden');
        });

        installPwaBtn.addEventListener('click', async () => {
            if (state.deferredPrompt) {
                state.deferredPrompt.prompt();
                const { outcome } = await state.deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installPwaBtn.classList.add('hidden');
                }
                state.deferredPrompt = null;
            }
        });

        settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

        cfg12h.addEventListener('change', (e) => {
            state.is12h = e.target.checked;
            updateClock();
        });

        cfgBurnin.addEventListener('change', (e) => {
            state.burnIn = e.target.checked;
            if (!state.burnIn) burninWrapper.style.transform = 'translate(0px, 0px)';
        });

        unitC.addEventListener('click', () => {
            state.tempUnit = 'C';
            unitC.className = 'px-2.5 py-0.5 rounded-md bg-zinc-700 text-white font-extrabold';
            unitF.className = 'px-2.5 py-0.5 rounded-md text-zinc-400 font-extrabold';
            document.getElementById('weather-temp').textContent = `${state.tempC}°C`;
        });

        unitF.addEventListener('click', () => {
            state.tempUnit = 'F';
            unitF.className = 'px-2.5 py-0.5 rounded-md bg-zinc-700 text-white font-extrabold';
            unitC.className = 'px-2.5 py-0.5 rounded-md text-zinc-400 font-extrabold';
            const tempF = Math.round((state.tempC * 9/5) + 32);
            document.getElementById('weather-temp').textContent = `${tempF}°F`;
        });

        handleSpotifyCallback();
        initSpotifyPlayer();
    </script>
